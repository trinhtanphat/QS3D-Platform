name: Bootstrap QS3D Platform Preview Release

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/bootstrap-preview-release.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: v0.1.0-preview.1
      TARGET_SHA: 4d3080ec4eae40fb36eb48215c8891be4e459fe5
    steps:
      - name: Create tag and GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; leaving it unchanged."
            exit 0
          fi

          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$TARGET_SHA" \
            --title "QS3D Platform v0.1.0-preview.1" \
            --prerelease \
            --notes $'First QS3D Platform preview release.\n\nValidated source/reference baseline for the shared vendor-neutral QS3D domain, CAD contracts, application services, quantity/BQ, diagnostics, persistence, parity and family schema layers.\n\nValidation evidence: QS3D Platform CI #84 succeeded on commit 4d3080ec4eae40fb36eb48215c8891be4e459fe5.\n\nThis is a Platform/source release for consuming products such as QS3D-CAD and QS3D-BricsCAD. It is not an end-user CAD installer and does not claim native DWG/runtime qualification.'

          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json tagName,name,isPrerelease,targetCommitish,url
