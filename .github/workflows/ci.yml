name: QS3D Platform CI

on:
  push:
    branches:
      - main
      - "agent/**"
      - "recovery/**"
      - "integration/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact task SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify exact checkout SHA
        shell: bash
        run: |
          expected='${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}'
          actual="$(git rev-parse HEAD)"
          test "${actual,,}" = "${expected,,}" || { echo "Checkout SHA mismatch: expected $expected, actual $actual"; exit 1; }
          echo "Exact source SHA: $actual"

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Run authoritative validation
        run: bash scripts/validate.sh
